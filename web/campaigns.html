<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Кампании — Keitaro</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="campaigns">
<main class="card">
  <div class="page-head">
    <a class="back-link link" href="/">← На главную</a>
    <h1>Кампании</h1>
  </div>

  <div class="field filter-row">
    <label for="campaign-query">Поиск по названию кампании</label>
    <input type="search" id="campaign-query" autocomplete="off" spellcheck="false">
  </div>

  <p id="hint" class="message info"></p>
  <p id="loading" class="loading" role="status" hidden>Ищем кампании…</p>

  <div id="error-state" role="alert" tabindex="-1" hidden>
    <p id="error-text" class="message error"></p>
    <div id="error-actions" class="error-actions"></div>
  </div>

  <p id="empty-state" class="message info" hidden></p>

  <div id="table-block" hidden>
    <p id="campaign-count" class="counter" role="status"></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col" class="num">ID</th>
            <th scope="col">Кампания</th>
            <th scope="col">Группа</th>
            <th scope="col">Статус</th>
            <th scope="col">Обновлена</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
