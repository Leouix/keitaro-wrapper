<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Keitaro — API key</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="home">
<main class="card">
  <h1>Keitaro — потоки кампаний</h1>

  <p id="key-status" class="status-line" hidden></p>

  <form id="key-form" novalidate>
    <div class="field">
      <label for="api-key">Укажите свой API key</label>
      <input type="password" id="api-key" name="api_key" autocomplete="off" spellcheck="false">
    </div>
    <button type="submit" id="save-btn" class="btn" disabled>Далее</button>
  </form>

  <p id="key-error" class="message error" role="alert" hidden></p>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
