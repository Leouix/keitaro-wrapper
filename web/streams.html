<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Потоки кампании — Keitaro</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="streams">
<main class="card">
  <div class="page-head">
    <a class="back-link link" href="/campaigns">← К списку кампаний</a>
    <h1 id="page-title">Потоки кампании</h1>
  </div>

  <div id="content">
    <p id="loading" class="loading" role="status">Загружаем потоки…</p>

    <div id="error-state" role="alert" tabindex="-1" hidden>
      <p id="error-text" class="message error"></p>
      <div id="error-actions" class="error-actions"></div>
    </div>

    <div id="empty-state" hidden>
      <p class="message info">В этой кампании нет потоков.</p>
    </div>

    <div id="table-block" hidden>
      

      <div class="table-wrap">
        <table>
          <caption id="table-caption"></caption>
          <thead>
            <tr>
              <th scope="col">Офер</th>
              <th scope="col">Статус</th>
              <th scope="col" class="num">Доля</th>
              <th scope="col">Поток</th>
              <th scope="col" class="num">Вес потока</th>
              <th scope="col" class="num">Выплата</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <p id="no-offers-line" class="no-offers" hidden></p>

      <div id="offer-toolbar" class="offer-toolbar">
        
        <div class="field offer-search-field">
          <label for="offer-id">Добавить оффер</label>
          <input id="offer-id" type="search" inputmode="numeric" autocomplete="off"
                 placeholder="Введите ID оффера" aria-describedby="offer-hint">
          <p id="offer-hint" class="offer-hint" role="status" aria-live="polite"></p>
        </div>
        <div class="field stream-field">
          <label for="stream-select">Поток</label>
          <select id="stream-select"></select>
          <p id="streams-hint" class="offer-hint" hidden>В этой кампании нет потоков, принимающих оферы</p>
        </div>
        <div class="toolbar-actions">
          <button id="add-btn" type="button" class="btn btn-secondary" disabled
                  title="Сначала найдите офер по ID">Добавить</button>
          <button id="send-btn" type="button" class="btn" disabled
                  title="Сначала добавьте офер в черновик кнопкой «Добавить»">Отправить в Кейтаро</button>
        </div>
      </div>
      <p id="send-status" class="status-line" role="status" hidden></p>

    </div>
  </div>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
