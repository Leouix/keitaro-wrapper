<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Потоки кампании — Keitaro</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="streams">
<main class="card">
  <div class="page-head">
    <a class="back-link link" href="/campaigns">← К списку кампаний</a>
    <h1 id="page-title">Потоки кампании</h1>
    <p id="campaign-id-line" class="counter"></p>
  </div>

  <div id="content">
    <p id="loading" class="loading" role="status">Загружаем потоки…</p>

    <div id="error-state" role="alert" tabindex="-1" hidden>
      <p id="error-text" class="message error"></p>
      <div id="error-actions" class="error-actions"></div>
    </div>

    <div id="empty-state" hidden>
      <p class="message info">В этой кампании нет потоков.</p>
    </div>

    <div id="table-block" hidden>
      <div id="draft-bar" class="draft-bar">
        <button id="send-btn" type="button" class="btn" disabled
                title="Сначала добавьте офер в черновик кнопкой «Добавить»">Отправить в Кейтаро</button>
        <span id="draft-count" class="draft-count"></span>
      </div>
      <p id="send-status" class="status-line" role="status" hidden></p>
      <div id="streams-list"></div>
    </div>
  </div>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
